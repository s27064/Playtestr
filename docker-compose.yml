services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: playtestr
      POSTGRES_PASSWORD: playtestr
      POSTGRES_DB: playtestr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playtestr"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=playtestr;Username=playtestr;Password=playtestr
      Jwt__Key: ${JWT_KEY:-dev-only-insecure-key-change-me-0123456789abcdef}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: